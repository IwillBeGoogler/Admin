name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Parallel: static checks, build, and the tests split over 3 shards (coverage floor on the merged report).
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build

  test-shard:
    name: Tests (admin ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      VITEST_SHARD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Run shard
        run: bunx vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        with:
          name: admin-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          include-hidden-files: true
          retention-days: 1

  test:
    name: Tests (admin, merged coverage)
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: admin-blob-*
          path: .vitest/blob
          merge-multiple: true
      - name: Merge reports and check the coverage floor
        run: bunx vitest --merge-reports --coverage
